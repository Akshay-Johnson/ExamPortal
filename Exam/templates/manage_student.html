<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Student</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa, #cce0ff);
        }
        .sidebar {
            width: 280px;
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.8), rgba(63, 81, 181, 0.8));
            color: white;
            padding: 30px;
            position: fixed;
            height: 100%;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            color: white;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            flex-grow: 1;
        }
        .sidebar ul li {
            padding: 18px;
            transition: 0.3s;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .sidebar ul li a {
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
        }
        .sidebar ul li:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .main-content {
            margin-left: 300px;
            padding: 30px;
            flex-grow: 1;
        }
        .header {
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.8), rgba(29, 78, 216, 0.8));
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .info {
            margin-bottom: 10px;
            font-size: 16px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #673AB7;
            margin-bottom: 15px;
        }
        .button {
            padding: 10px 15px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        .button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="{% url 'admindashboard' %}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="{% url 'manage_exams' %}"><i class="fas fa-file-alt"></i> View Exams</a></li>
            <li><a href="{% url 'teacher_pending' %}"><i class="fas fa-user-plus"></i> Approve Teachers</a></li>
            <li><a href="{% url 'exam_approval' %}"><i class="fas fa-clipboard-check"></i> Approve Exams</a></li>
            <li><a href="{% url 'manage_users' %}"><i class="fas fa-users"></i> Manage Users</a></li>
            <li><a href="{% url 'user_logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="header">Manage Student</div>
        <div class="container">
            <h2>Manage Student: {{ student.username }}</h2>
            <img src="{% if student.profile.profile_picture %}{{ student.profile.profile_picture.url }}{% else %}https://via.placeholder.com/120{% endif %}" alt="Profile Picture" class="profile-img">
            <div class="info"><strong>Email:</strong> {{ student.email }}</div>
            <div class="info"><strong>Phone:</strong> {{ student.profile.phone }}</div>
            <a href="{% url 'manage_users' %}" class="button">Back</a>
        </div>
    </div>
</body>
</html>
