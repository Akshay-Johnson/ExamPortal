<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; min-height: 100vh; background: linear-gradient(135deg, #e0f7fa, #cce0ff); }
        .sidebar { width: 280px; background: linear-gradient(135deg, rgba(44, 62, 80, 0.8), rgba(63, 81, 181, 0.8)); color: white; padding: 30px; position: fixed; height: 100%; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; font-size: 28px; font-weight: 600; color: white; }
        .sidebar ul { list-style: none; padding: 0; }
        .sidebar ul li { padding: 18px; transition: 0.3s; border-radius: 8px; margin-bottom: 8px; }
        .sidebar ul li a { text-decoration: none; color: white; display: flex; align-items: center; gap: 12px; font-size: 16px; }
        .sidebar ul li:hover { background: rgba(255, 255, 255, 0.1); }
        .main-content { margin-left: 300px; padding: 30px; flex-grow: 1; }
        .container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1); margin-top: 25px; }
        h2 { color: #333; text-align: center; margin-bottom: 25px; font-size: 28px; font-weight: 600; }
        .form-group { display: flex; flex-direction: column; margin-bottom: 15px; }
        .form-group label { font-size: 18px; color: #333; margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group input:focus { border-color: #673AB7; outline: none; box-shadow: 0 0 8px rgba(103, 58, 183, 0.3); }
        .error-message { color: red; font-size: 14px; margin-top: 5px; display: none; }
        .button { width: 100%; padding: 14px; background: #1e88e5; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; text-align: center; transition: 0.3s; }
        .button:hover { background: #0d47a1; }
        img.profile-preview { max-width: 120px; border-radius: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Student Panel</h2>
        <ul>
            <li><a href="{% url 'studentdashboard' %}"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="{% url 'available_exam' %}"><i class="fas fa-file-alt"></i> Take Exams</a></li>
            <li><a href="{% url 'my_results' %}"><i class="fas fa-chart-bar"></i> My Results</a></li>
            <li><a href="{% url 'student_profile' %}"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="{% url 'user_logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="container">
            <h2>Update Your Details</h2>
            <form id="profileForm" method="POST" action="{% url 'update_student_profile' %}" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" name="username" id="username" value="{{ user.username }}" required>
                </div>

                <div class="form-group">
                    <label for="first_name">First Name:</label>
                    <input type="text" name="first_name" id="first_name" value="{{ user.first_name }}" required>
                </div>

                <div class="form-group">
                    <label for="last_name">Last Name:</label>
                    <input type="text" name="last_name" id="last_name" value="{{ user.last_name }}" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" value="{{ user.email }}" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="text" name="phone" id="phone" value="{{ user.profile.phone }}" maxlength="10" pattern="\d{10}" required>
                    <span class="error-message" id="phone-error">Phone number must be 10 digits and cannot start with 0</span>
                </div>

                {% if user.profile.profile_picture %}
                    <div class="form-group">
                        <label>Current Profile Picture:</label><br>
                        <img src="{{ user.profile.profile_picture.url }}" alt="Profile Picture" class="profile-preview">
                    </div>
                {% endif %}

                <div class="form-group">
                    <label for="profile_picture">Upload New Profile Picture:</label>
                    <input type="file" name="profile_picture" id="profile_picture" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="password">New Password (Optional):</label>
                    <input type="password" name="password" id="password">
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" name="confirm_password" id="confirm_password">
                    <span class="error-message" id="password-error">Passwords do not match</span>
                </div>

                <button type="submit" class="button">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- JavaScript for Validation -->
    <script>
        document.getElementById("profileForm").addEventListener("submit", function(event) {
            let phoneInput = document.getElementById("phone").value;
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirm_password").value;
            let phoneError = document.getElementById("phone-error");
            let passwordError = document.getElementById("password-error");

            let isValid = true;

            // Phone number validation: Must be exactly 10 digits and not start with 0
            if (!/^[1-9]\d{9}$/.test(phoneInput)) {
                phoneError.style.display = "block";
                phoneError.textContent = "Phone number must be 10 digits and cannot start with 0";
                isValid = false;
            } else {
                phoneError.style.display = "none";
            }

            // Password validation: Ensure passwords match
            if (password !== "" && password !== confirmPassword) {
                passwordError.style.display = "block";
                isValid = false;
            } else {
                passwordError.style.display = "none";
            }

            if (!isValid) {
                event.preventDefault();
                Swal.fire({
                    icon: "error",
                    title: "Validation Error",
                    text: "Please correct the errors before submitting.",
                });
            }
        });
    </script>

</body>
</html>
